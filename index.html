/* ===== MÓDULO PRÁCTICA (usa D.gram, D.voc y D.vb) =====

const PU={1:{g:["pron"],c:["Saludos"],v:["say","meet","call","ask","answer"]},2:{g:["tobe","afneg"],c:["Información personal","Profesiones"],v:["live","work","study","have"]},3:{g:["pos"],c:["Familia","Cuerpo"],v:["love","visit","help","miss","kiss","hate"]},4:{g:["art","dem","plur"],c:["Casa y objetos","Escuela y trabajo"],v:["use","open","close","put","bring","need","fix","clean"]},5:{g:["simple","adv","have"],c:["Rutinas","Verbos frecuentes"],v:["get","go","come","eat","drink","sleep","work","study","watch","cook","wash","start","finish"]},6:{g:["prep"],c:["Números y fechas"],v:["begin","start","finish","arrive","leave","wait","stay"]},7:{g:["some","much"],c:["Comida y bebidas"],v:["eat","drink","cook","buy","order","like","want"]},8:{g:["can"],c:["Hobbies"],v:["play","swim","sing","dance","read","run","jump","paint","walk"]},9:{g:["there"],c:["Ciudad y transporte"],v:["walk","drive","turn","follow","stop","find","take","go"]},10:{g:["wh"],c:["Compras","Ropa","Colores y adjetivos"],v:["buy","sell","pay","wear","shop","try","carry"]},11:{g:["cont"],c:["Clima"],v:["rain","smile","laugh","cry","listen","look","wait","run","rest","talk"]}};
const VCL={"Saludos":1,"Información personal":1,"Números y fechas":1,"Familia":1,"Colores y adjetivos":1,"Comida y bebidas":1,"Ropa":1,"Cuerpo":1,"Profesiones":2,"Casa y objetos":2,"Escuela y trabajo":2,"Compras":2,"Clima":2,"Ciudad y transporte":2,"Rutinas":3,"Hobbies":3,"Verbos frecuentes":3};
const PT={mc:["Opción múltiple","Elige la respuesta correcta y pulsa «Comprobar»."],fill:["Completar espacios","Escribe la palabra que falta en la oración en inglés."],ord:["Ordenar palabras","Toca las palabras en orden para formar la oración en inglés. Toca una palabra colocada para quitarla."],match:["Relacionar","Elige la traducción al español de cada palabra en inglés."],fix:["Corregir errores","Cada oración en inglés tiene un error gramatical. Escribe la oración corregida."]};
const PMIN={mc:4,fill:4,ord:4,match:6,fix:2},PSZ={mc:8,fill:8,ord:6,fix:6};
/* correcciones alternativas válidas (clave = oración con error) */
const ALT={"This books":["This book"],"Those is my car":["Those are my cars"],"I have 20 years.":["I am 20.","I am twenty years old.","I am twenty."],"I have much friends.":["I have a lot of friends."]};
let PF={u:0,d:0},PR=null;
const pu=(k,x)=>!PF.u||PF.u===12||(PU[PF.u][k]||[]).includes(x),pd=l=>!PF.d||PF.d===l;
const pLv=v=>{const a=v.ex.match(/\{(.+?)\}/)[1].toLowerCase();return a===v.b?1:v.k==="R"?2:3};
const CT=[[/\bi'm\b/g,"i am"],[/\b(you|we|they)'re\b/g,"$1 are"],[/\b(he|she|it|there|that)'s\b/g,"$1 is"],[/\bisn't\b/g,"is not"],[/\baren't\b/g,"are not"],[/\bdoesn't\b/g,"does not"],[/\bdon't\b/g,"do not"],[/\bcan't\b/g,"can not"],[/\bcannot\b/g,"can not"]];
const nn=s=>{s=s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ");CT.forEach(([a,b])=>s=s.replace(a,b));return s.replace(/\s+/g," ").trim()};
const mix=(P,n)=>{P=P.map(p=>shuffle(p));const o=[];let i=0;while(o.length<n&&P.some(p=>p.length)){const p=P[i++%P.length];if(p.length)o.push(p.pop())}return o};
/* ---- generadores (reciben el filtro PF) ---- */
function pMC(){const G=[],V=[],T=D.voc.map(v=>v.t);
 D.gram.forEach(g=>{if(pu("g",g.id)&&pd(g.lv))g.q.forEach(q=>{const ix=shuffle([0,1,2]);G.push({k:"mc",q:q.s,o:ix.map(i=>q.o[i]),a:ix.indexOf(q.a),n:1,why:`${g.t}: ${g.est}`,src:"Gramática · "+g.t})})});
 D.voc.forEach(v=>{if(pu("c",v.c)&&pd(VCL[v.c])){const o=shuffle([v.t,...shuffle(T.filter(t=>t!==v.t)).slice(0,2)]);V.push({k:"mc",q:`What does “${v.w}” mean?`,o,a:o.indexOf(v.t),n:1,why:`«${v.w}» significa «${v.t}».`,src:"Vocabulario · "+v.c})}});
 return[G,V]}
function pFill(){const A=[],B=[];
 D.vb.forEach(v=>{if(pu("v",v.b)&&pd(pLv(v))){const a=v.ex.match(/\{(.+?)\}/)[1];A.push({k:"fill",s:v.ex.replace(/\{.+?\}/,"_____"),tr:v.et,a,alt:[],hint:"verbo: "+v.b,n:1,why:v.ex.startsWith("{")?`En una orden se usa la forma base: «${a}».`:a===v.s3?`Con he / she / it el verbo añade -s o -es: «${a}».`:`Con I / you / we / they se usa la forma base: «${a}».`,src:"Verbos · "+v.b})}});
 D.voc.forEach(v=>{if(pu("c",v.c)&&pd(VCL[v.c])){const m=v.e.match(new RegExp("\\b"+v.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i"));if(m)B.push({k:"fill",s:v.e.replace(m[0],"_____"),tr:v.et,a:m[0],alt:[],hint:`significa «${v.t}»`,n:1,why:`La palabra es «${m[0]}»: significa «${v.t}».`,src:"Vocabulario · "+v.c})}});
 return[A,B]}
function pOrd(){const L=[],seen={};const add=(t,tr,lv,why,src)=>{const w=t.trim().split(/\s+/);if(w.length>=3&&w.length<=8&&!/\//.test(t)&&pd(lv)&&!seen[t]){seen[t]=1;let ix=w.map((x,i)=>i),b=ix,k=0;do{b=shuffle(ix)}while(b.join()===ix.join()&&k++<10);L.push({k:"ord",target:t,tr,bank:b.map(i=>w[i]),n:1,why:`Orden correcto: «${t}». ${why}`,src})}};
 D.gram.forEach(g=>{if(pu("g",g.id))g.ex.forEach(e=>add(e[0],e[1],g.lv,"Estructura: "+g.est,"Gramática · "+g.t))});
 D.voc.forEach(v=>{if(pu("c",v.c))add(v.e,v.et,VCL[v.c],`Vocabulario: «${v.w}» = ${v.t}.`,"Vocabulario · "+v.c)});
 D.vb.forEach(v=>{if(pu("v",v.b))add(cl(v.ex),v.et,pLv(v),`Verbo ${v.b}: ${v.s3}, ${v.ing}.`,"Verbos · "+v.b)});
 return L}
function pPairs(){const P=[],a={},b={};const add=(en,es)=>{if(!a[en.toLowerCase()]&&!b[es.toLowerCase()]){a[en.toLowerCase()]=b[es.toLowerCase()]=1;P.push([en,es])}};
 D.voc.forEach(v=>{if(pu("c",v.c)&&pd(VCL[v.c]))add(v.w,v.t)});D.vb.forEach(v=>{if(pu("v",v.b)&&pd(pLv(v)))add(v.b,v.t)});return P}
function pMatch(){const P=shuffle(pPairs()).slice(0,6);return{k:"match",rows:P.map(p=>({en:p[0],es:p[1]})),opts:shuffle(P.map(p=>p[1])),n:6,why:"Revisa los pares marcados con ✗.",src:"Vocabulario y verbos"}}
function pFix(){const L=[];D.gram.forEach(g=>{if(pu("g",g.id)&&pd(g.lv))g.err.forEach(e=>L.push({k:"fix",q:e[0],a:e[1],alt:ALT[e[0]]||[],n:1,why:`${e[2]} (${g.t})`,src:"Gramática · "+g.t}))});return L}
const pCount=()=>{const m=pMC(),f=pFill();return{mc:m[0].length+m[1].length,fill:f[0].length+f[1].length,ord:pOrd().length,match:pPairs().length,fix:pFix().length}};
function pBuild(t){return t==="mc"?mix(pMC(),PSZ.mc):t==="fill"?mix(pFill(),PSZ.fill):t==="ord"?shuffle(pOrd()).slice(0,PSZ.ord):t==="fix"?shuffle(pFix()).slice(0,PSZ.fix):[pMatch()]}
/* ---- comprobación y puntuación (lógica pura) ---- */
function prEval(it,c){
 if(it.k==="mc")return{ok:c.sel===it.a,pts:c.sel===it.a?1:0};
 if(it.k==="fill"||it.k==="fix"){const ok=[it.a,...it.alt].some(x=>nn(x)===nn(c.text));return{ok,pts:ok?1:0}}
 if(it.k==="ord"){const ok=nn(c.ch.map(i=>it.bank[i]).join(" "))===nn(it.target);return{ok,pts:ok?1:0}}
 const rows=it.rows.map((r,i)=>c.sels[i]===r.es),pts=rows.filter(Boolean).length;return{ok:pts===it.rows.length,pts,rows}}
const prTotal=(set,pts)=>({p:pts.reduce((a,b)=>a+(b||0),0),n:set.reduce((a,b)=>a+b.n,0)});
/* ---- interfaz ---- */
const prCur=()=>({sel:null,text:"",ch:[],sels:[]});
function prStart(t){const set=pBuild(t);if(set.length<(t==="match"?1:PMIN[t]))return;PR={t,set,i:0,pts:[],tries:[],cur:prCur(),ck:null,msg:"",saved:false};prView()}
function prCheck(){const it=PR.set[PR.i],c=PR.cur;if(PR.ck)return;
 const empty=it.k==="mc"?c.sel===null:it.k==="match"?it.rows.some((r,i)=>!c.sels[i]):it.k==="ord"?!c.ch.length:!c.text.trim();
 if(empty){PR.msg=it.k==="match"?"Elige una traducción en cada fila.":it.k==="mc"?"Elige una opción.":it.k==="ord"?"Toca al menos una palabra.":"Escribe tu respuesta.";prView();return}
 const r=prEval(it,c);if(PR.tries[PR.i]===undefined){PR.tries[PR.i]=0;PR.pts[PR.i]=r.pts;if(r.pts<it.n){const E=S.errs||(S.errs={});E[it.src]=(E[it.src]||0)+1;save()}}PR.ck=r;PR.msg="";prView()}
function prRetry(){PR.tries[PR.i]++;PR.cur=prCur();PR.ck=null;PR.msg="";prView()}
function prNext(){PR.i++;PR.cur=prCur();PR.ck=null;PR.msg="";if(PR.i>=PR.set.length&&!PR.saved){PR.saved=true;const s=prTotal(PR.set,PR.pts);sc2("practica-"+PR.t,"Práctica · "+PT[PR.t][0],Math.round(s.p/s.n*100))}prView();window.scrollTo(0,0)}
function prExit(x){if(x==="hub"){PR=null}else if(x==="new"){prStart(PR.t);return}else{PR={...PR,i:0,pts:[],tries:[],cur:prCur(),ck:null,msg:"",saved:false}}prView();window.scrollTo(0,0)}

 const t=PR.t;

  app.innerHTML=`<h1>${PT[t][0]}</h1><div class="card"><div class="big">${p}%</div><p>${s.p} de ${s.n} puntos al primer intento.</p><p>${PR.set.map((it,i)=>PR.pts[i]===it.n?"✓":PR.pts[i]>0?"◐":"✗").join(" ")}</p><div class="row"><button class="btn" data-prx="again">Repetir esta serie</button><button class="btn ghost" data-prx="new">Nueva serie</button><button class="btn ghost" data-prx="hub">Volver a Práctica</button></div></div>`;return}
 const it=PR.set[PR.i],c=PR.cur,ck=PR.ck;let body="",fb="";

 else if(it.k==="fill"||it.k==="fix")body=(it.k==="fix"?`<p class="sub" style="margin:0">Oración con error:</p><h2 class="en">${it.q}</h2>`:`<h2 class="en">${it.s}</h2><p class="sub" style="margin:0 0 10px">${it.tr} · ${it.hint}</p>`)+`<input class="srch" id="pri" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${it.k==="fix"?"Escribe la oración corregida":"Escribe aquí"}" value="${c.text.replace(/"/g,"&quot;")}" ${ck?"disabled":""}>`;
 else if(it.k==="ord")body=`<p class="sub" style="margin:0 0 6px">${it.tr}</p><div class="chosen">${c.ch.length?c.ch.map((b,pos)=>`<button class="wd ${ck?(ck.ok?"ok":"bad"):""}" data-pwc="${pos}" ${ck?"disabled":""}>${it.bank[b]}</button>`).join(""):`<small>Toca las palabras de abajo…</small>`}</div><div class="chosen" style="border-style:solid">${it.bank.map((w,j)=>`<button class="wd" data-pwb="${j}" ${c.ch.includes(j)||ck?"disabled":""}>${w}</button>`).join("")}</div>${ck?"":`<button class="btn ghost sm" data-prclr>Limpiar</button>`}`;
 else body=it.rows.map((r,i)=>`<div class="mrow"><b class="en">${r.en}</b><select class="srch" data-pm="${i}" ${ck?"disabled":""}><option value="">— elige —</option>${it.opts.map(o=>`<option ${c.sels[i]===o?"selected":""}>${o}</option>`).join("")}</select></div>`).join("");
 if(ck){fb=it.k==="match"?`<div class="fb ${ck.ok?"ok-t":"bad-t"}"><b>${ck.pts} de ${it.rows.length} correctas</b></div>${it.rows.map((r,i)=>`<div class="fb ${ck.rows[i]?"ok-t":"bad-t"}">${ck.rows[i]?"✓":"✗"} ${r.en} = ${r.es}</div>`).join("")}`:`<div class="fb ${ck.ok?"ok-t":"bad-t"}"><b>${ck.ok?"✓ ¡Correcto!":"✗ Todavía no."}</b> ${it.why}</div>`}

const TTS={ok:typeof speechSynthesis!=="undefined"&&typeof SpeechSynthesisUtterance!=="undefined",voices:[],rate:(S.tts&&S.tts.rate)||0.85,voice:(S.tts&&S.tts.voice)||"",last:null,fail:false,seq:0,msg:""};
TTS.load=()=>{if(TTS.ok)TTS.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))};
TTS.info=()=>!TTS.ok?"Tu navegador no admite síntesis de voz: usa las transcripciones de cada ejercicio.":TTS.voices.length?"Voz en inglés disponible en este dispositivo.":"No se detectó una voz en inglés en este dispositivo (puede estar cargando). Si no oyes nada o suena con acento español, usa las transcripciones.";
TTS.say=m=>{TTS.msg=m;const e=document.querySelector("#ttsmsg");if(e)e.textContent=m};
TTS.speak=(text,o={})=>{if(!TTS.ok){TTS.say("Tu navegador no admite síntesis de voz. Usa la transcripción.");return false}
 if(!o.keep)TTS.seq++;speechSynthesis.cancel();TTS.say("");
 const u=new SpeechSynthesisUtterance(text),v=TTS.voices.find(x=>x.name===TTS.voice)||TTS.voices.find(x=>/^en[-_]US/i.test(x.lang))||TTS.voices[0];
 u.lang=v?v.lang:"en-US";if(v)u.voice=v;u.rate=o.rate||TTS.rate;u.pitch=o.pitch||1;let started=false;
 u.onstart=()=>{started=true;TTS.fail=false};u.onend=o.onend||null;
 u.onerror=e=>{if(e.error==="canceled"||e.error==="interrupted")return;TTS.fail=true;TTS.say("No se pudo reproducir el audio ("+e.error+"). Usa la transcripción.")};
 TTS.last={text,o:{...o,onend:null}};speechSynthesis.speak(u);
 setTimeout(()=>{if(!started&&!speechSynthesis.speaking){TTS.fail=true;TTS.say("El audio no se inició. Puede que tu dispositivo no tenga voz en inglés o esté en silencio. Usa la transcripción.")}},3000);return true};
TTS.stop=()=>{TTS.seq++;if(TTS.ok)speechSynthesis.cancel()};

 return `${tSel("tf-es",TD.students.map(s=>[s.id,s.name]),TV.es,"Todo el grupo")}<p class="sub"><small>Calculado con ${n} copia${n===1?"":"s"} de progreso. Las prácticas cuentan errores del primer intento; los exámenes, respuestas incorrectas por tema. No incluye dictados ni diálogos.</small></p><div class="card" style="margin-bottom:14px"><h2>En exámenes</h2>${E.E.length?`<div class="wrap"><table><tr><th>Tema</th><th>Errores</th><th>Alumnos</th></tr>${E.E.slice(0,12).map(e=>`<tr><td>${esc(e.k)}</td><td>${e.w} de ${e.t}</td><td>${e.a}</td></tr>`).join("")}</table></div>`:`<p class="sub" style="margin:0">Sin errores registrados.</p>`}</div><div class="card"><h2>En prácticas</h2>${E.P.length?`<div class="wrap"><table><tr><th>Origen</th><th>Errores</th><th>Alumnos</th></tr>${E.P.slice(0,12).map(e=>`<tr><td>${esc(e.k)}</td><td>${e.n}</td><td>${e.a}</td></tr>`).join("")}</table></div>`:`<p class="sub" style="margin:0">Sin errores registrados (solo se guardan desde esta versión).</p>`}</div>`},
seguimiento:()=>{if(!TD.students.length)return `<p class="sub">Añade alumnos primero.</p>`;let all={done:0,pending:0,late:0};
 const body=TD.students.map(s=>{const T2=TD.tasks.filter(t=>t.to.includes(s.id)),c={done:0,pending:0,late:0};T2.forEach(t=>c[tStatus(t,s.id).s]++);Object.keys(c).forEach(k=>all[k]+=c[k]);
  return `<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b>${esc(s.name)}</b>${tTag(s.demo)}</div><small>${c.done} completadas · ${c.pending} pendientes · ${c.late} vencidas</small>${T2.map(t=>`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${esc(t.title)}</span><span>${tStat(t,s.id)} <button class="btn sm ghost" data-tman="${esc(t.id)}:${esc(s.id)}" aria-label="Marcar a mano">${t.man[s.id]?"Desmarcar":"Marcar"}</button></span></div>`).join("")||`<p class="sub" style="margin:8px 0 0">Sin tareas asignadas.</p>`}</div>`}).join("");
 return `<p><b>Total:</b> ${all.done} completadas · ${all.pending} pendientes · ${all.late} vencidas</p>${body}`},
datos:()=>`<div class="card" style="margin-bottom:14px"><h2>Datos de ejemplo</h2><p class="sub" style="margin:0 0 8px"><small>Crea alumnos, tareas y notas <b>ficticios</b>, marcados como EJEMPLO, para probar el modo profesor. Sus resultados no son reales.</small></p><div class="row"><button class="btn sm" data-tdemo>Cargar ejemplo</button><button class="btn sm ghost" data-tundemo>Quitar ejemplo</button></div>${tConf("undemo","Se quitarán solo los datos marcados como EJEMPLO.")}</div>
<div class="card" style="margin-bottom:14px"><h2>Copia de los datos del profesor</h2><textarea class="srch" id="tf-tx" rows="4" aria-label="Copia de datos del profesor" placeholder="Aquí aparece el texto exportado, o pega el que quieras importar">${esc(TV.tx)}</textarea><div class="row"><button class="btn sm ghost" data-texp>Exportar</button><button class="btn sm ghost" data-timp>Importar</button></div>${tConf("imp","Importar reemplazará los datos actuales del profesor.")}</div>
<div class="card"><h2>Borrar datos del profesor</h2><button class="btn ghost" data-treset>Borrar todo</button>${tConf("reset","Se borrarán alumnos, tareas y notas. No afecta al progreso del alumno en este navegador.")}</div>`};
function tView(){app.innerHTML=`<h1>Modo profesor</h1><div class="card" style="border-color:var(--bad);margin-bottom:14px"><b>DEMOSTRACIÓN LOCAL · no es un sistema seguro</b><p style="margin:6px 0 0"><small>No hay inicio de sesión ni contraseñas: cualquiera que abra esta página en este navegador puede ver y cambiar estos datos. No hay servidor ni sincronización multiusuario: los datos viven solo aquí. El progreso de un alumno solo se ve si pegas su copia de seguridad (Mi progreso → Exportar) o usas el progreso de este navegador. No uses datos personales sensibles.</small></p>${TST.ok?"":`<p class="bad-t" role="alert"><b>⚠ No se puede guardar en este navegador.</b></p>`}${TST.corrupt?`<p class="bad-t" role="alert"><small>Se encontraron datos del profesor dañados; se conservó una copia aparte.</small></p>`:""}${TV.msg?`<p class="ok-t" role="status"><b>${esc(TV.msg)}</b></p>`:""}${TV.err?`<p class="bad-t" role="alert"><b>${esc(TV.err)}</b></p>`:""}</div><div class="chips">${TTABS.map(x=>`<button class="btn sm ${x[0]===TV.tab?"":"ghost"}" data-ttab="${x[0]}">${x[1]}</button>`).join("")}</div>${TB[TV.tab]()}`}
const tM=m=>{TV.msg=m;TV.err="";TV.ask="";tView()};
function tAddStudent(){const n=tst(TV.name).trim();if(!n){TV.err="Escribe un nombre.";tView();return}TD.students.push({id:tid(),name:n,demo:false,ts:0,snap:null});TV.name="";TV.to=null;tSave();tM("Alumno añadido.")}
function tRename(id){const n=tst(TV.ren).trim(),s=TD.students.find(x=>x.id===id);if(s&&n)s.name=n;TV.edit=null;tSave();tM("Nombre actualizado.")}
function tSnap(id,src){const s=TD.students.find(x=>x.id===id);if(!s)return;s.snap=sClean(JSON.parse(JSON.stringify(src)))||sClean({done:{}});s.ts=Date.now();tSave();tM("Copia de progreso guardada.")}
function tPaste(id){let o=null;try{o=sClean(JSON.parse(TV.paste))}catch(e){}if(!o){TV.err="El texto no es una copia de seguridad válida.";tView();return}const s=TD.students.find(x=>x.id===id);s.snap=o;s.ts=Date.now();TV.sel=null;TV.paste="";tSave();tM("Copia de progreso guardada.")}
function tAddTask(){const k=TV.kind,to=Object.entries(tTo()).filter(e=>e[1]).map(e=>e[0]).filter(id=>TD.students.some(s=>s.id===id));
 let title=tst(TV.title).trim();if(!title&&k!=="free"){const r=tRefs(k).find(x=>String(x[0])===String(TV.ref));title=(TKIND[k]+": "+(r?r[1]:""))}
 if(!title){TV.err="Escribe un título.";tView();return}if(!to.length){TV.err="Asigna la tarea al menos a un alumno.";tView();return}
 TD.tasks.push({id:tid(),title,kind:k,ref:k==="free"?"":String(TV.ref),due:tdate(TV.due),to,man:{},demo:false});TV.title="";TV.due="";tSave();tM("Tarea creada.")}
function tManual(v){const[tidv,sid]=v.split(":"),t=TD.tasks.find(x=>x.id===tidv);if(!t)return;t.man[sid]=!t.man[sid];tSave();TV.msg="";tView()}
function tAddGrade(){const sc=parseFloat(TV.gv);if(!TD.students.some(s=>s.id===TV.gs)){TV.err="Elige un alumno.";tView();return}if(!(sc>=0&&sc<=100)){TV.err="La nota debe estar entre 0 y 100.";tView();return}
 TD.grades.push({id:tid(),sid:TV.gs,concept:tst(TV.gc).trim()||"Nota",score:sc,date:tdate(TV.gd)||tToday(),note:tst(TV.gn),demo:false});TV.gc=TV.gv=TV.gn="";tSave();tM("Nota registrada.")}
function tConfirm(a){const[k,id]=[a.split(":")[0],a.slice(a.indexOf(":")+1)];
 if(k==="del"){TD.students=TD.students.filter(s=>s.id!==id);TD.grades=TD.grades.filter(g=>g.sid!==id);TD.tasks.forEach(t=>{t.to=t.to.filter(x=>x!==id);delete t.man[id]});TV.to=null;TV.rs="";tSave();tM("Alumno eliminado.")}
 else if(k==="task"){TD.tasks=TD.tasks.filter(t=>t.id!==id);tSave();tM("Tarea eliminada.")}
 else if(k==="grade"){TD.grades=TD.grades.filter(g=>g.id!==id);tSave();tM("Nota borrada.")}
 else if(a==="undemo"){const dm=TD.students.filter(s=>s.demo).map(s=>s.id);TD.students=TD.students.filter(s=>!s.demo);TD.tasks=TD.tasks.filter(t=>!t.demo);TD.tasks.forEach(t=>{t.to=t.to.filter(x=>!dm.includes(x))});TD.grades=TD.grades.filter(g=>!g.demo&&!dm.includes(g.sid));TV.to=null;TV.rs="";tSave();tM("Datos de ejemplo quitados.")}
 else if(a==="imp"){TD=TV.imp;TV.imp=null;TV.to=null;TV.rs="";tSave();tM("Datos importados.")}
 else if(a==="reset"){TD={v:1,students:[],tasks:[],grades:[]};TV.to=null;TV.rs="";tSave();tM("Datos del profesor borrados.")}}
function tImport(){let o=null;try{o=tClean(JSON.parse(TV.tx))}catch(e){}if(!o||(!o.students.length&&!o.tasks.length&&!o.grades.length)){TV.err="El texto no es una copia válida de datos del profesor.";TV.ask="";tView();return}TV.err="";TV.imp=o;TV.ask="imp";tView()}
function tDemo(){if(TD.students.some(s=>s.demo)){tM("Los datos de ejemplo ya están cargados.");return}
 const iso=n=>new Date(Date.now()-n*864e5).toISOString(),mk=(name,good)=>{const voc={};D.voc.slice(0,good?30:6).forEach(v=>voc[v.id]={s:"l"});
  const snap=sClean({done:good?{u1l1:1,u1l2:1,u2l1:1}:{u1l1:1},vis:{u1l1:1},voc,gram:good?{tobe:5,pron:4}:{tobe:2},
   scores:[{id:"practica-mc",t:"Práctica · Opción múltiple",p:good?88:50,d:"",ts:Date.now()}],
   ev:[{code:"u1",t:"Evaluación · Unidad 1",d:iso(3),ok:good?9:5,tot:10,pct:good?90:50,byTopic:good?{"Pronombres personales y objeto":[3,3],"Saludos":[3,3],"Lectura":[2,3],"Verbos (formas)":[1,1]}:{"Pronombres personales y objeto":[1,3],"Saludos":[2,3],"Lectura":[1,3],"Verbos (formas)":[1,1]}}],
   errs:good?{"Gramática · Verbo to be":1}:{"Gramática · Verbo to be":6,"Gramática · Presente simple y do / does":5,"Verbos · work":3,"Vocabulario · Saludos":2},
   act:{l:"Práctica · Opción múltiple",h:"practica",o:"",ts:Date.now()}});return{id:tid(),name,demo:true,ts:Date.now(),snap}};
 const a=mk("Ana (ejemplo)",true),b=mk("Luis (ejemplo)",false);TD.students.push(a,b);const to=[a.id,b.id],d=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
 TD.tasks.push({id:tid(),title:"Completar la Unidad 1 (ejemplo)",kind:"unit",ref:"1",due:d(7),to,man:{},demo:true},{id:tid(),title:"Prueba diagnóstica (ejemplo)",kind:"exam",ref:"diag",due:d(-2),to,man:{},demo:true},{id:tid(),title:"Escribir 5 frases (ejemplo)",kind:"free",ref:"",due:d(3),to,man:{},demo:true});
 TD.grades.push({id:tid(),sid:a.id,concept:"Examen oral (ejemplo)",score:85,date:tToday(),note:"Dato ficticio",demo:true},{id:tid(),sid:b.id,concept:"Examen oral (ejemplo)",score:55,date:tToday(),note:"Dato ficticio",demo:true});TV.to=null;tSave();tM("Datos de ejemplo cargados (ficticios).")}
document.addEventListener("input",e=>{const id=e.target&&e.target.id;if(id&&id.startsWith("tf-")){const k=id.slice(3);if(k==="kind"){TV.kind=e.target.value;TV.ref=tRefs(TV.kind)[0]?String(tRefs(TV.kind)[0][0]):"";tView()}else{TV[k]=e.target.value;if(k==="rs"||k==="es")tView()}}});
document.addEventListener("change",e=>{const id=e.target&&e.target.id;if(id&&id.startsWith("tf-")&&["kind","rs","es","ref","gs"].includes(id.slice(3))){const k=id.slice(3);if(k==="kind"){TV.kind=e.target.value;TV.ref=tRefs(TV.kind)[0]?String(tRefs(TV.kind)[0][0]):""}else TV[k]=e.target.value;if(k!=="ref"&&k!=="gs")tView()}});
/* ===== MOTOR DE PREGUNTAS ===== */
function startQuiz(id){let qs,t;
 if(id==="practica"){const all=D.vocab.flatMap(v=>v.w);t="Práctica de vocabulario";
  qs=shuffle(all).slice(0,5).map(w=>{const o=shuffle([w[1],...shuffle(all.filter(x=>x[1]!==w[1])).slice(0,2).map(x=>x[1])]);return{q:`¿Cómo se dice «${w[0]}» en inglés?`,o,a:o.indexOf(w[1])}})}
 else{const T=D.tests.find(x=>x.id===id);t=T.t;qs=T.qs}
 Q={id,t,qs,i:0,s:0,ans:false};drawQ()}
function drawQ(){if(Q.i>=Q.qs.length){const p=Math.round(Q.s/Q.qs.length*100);
  sc2(Q.id,Q.t,p);
  app.innerHTML=`<h1>${Q.t}</h1><div class="card"><div class="big">${p}%</div><p>${Q.s} de ${Q.qs.length} respuestas correctas.</p><div class="row"><button class="btn" data-quiz="${Q.id}">Repetir</button><button class="btn ghost" data-go="progreso">Ver mi progreso</button></div></div>`;Q=null;return}
 const q=Q.qs[Q.i];
 app.innerHTML=`<h1>${Q.t}</h1><p class="sub">Pregunta ${Q.i+1} de ${Q.qs.length}</p><div class="card"><h2>${q.q}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-opt="${i}">${o}</button>`).join("")}</div><button class="btn" id="nx" data-next hidden>${Q.i+1<Q.qs.length?"Siguiente":"Ver resultado"}</button></div>`}
/* ===== EVENTOS ===== */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.go){if(d.go==="unidades")sub={};if(location.hash.slice(1)===d.go)route();else go(d.go)}
 else if(d.unit){sub={u:d.unit,t:"lecciones"};if(location.hash!=="#unidades")go("unidades");else route()}
 else if(d.tab){sub.t=d.tab;unitView()}
 else if(d.gt){GS.open=d.gt;GS.ans[d.gt]=GS.ans[d.gt]||[];gView();window.scrollTo(0,0)}
 else if("gb" in d){GS.open=null;gView();window.scrollTo(0,0)}
 else if(d.gl){GS.lv=+d.gl;gView()}
 else if(d.gq){gAnswer(d.gq)}
 else if("gr" in d){GS.ans[GS.open]=[];gView()}
 else if(d.vr){VS.rev[d.vr]=!VS.rev[d.vr];vList()}
 else if(d.vf){const o=vp(d.vf);o.f=o.f?0:1;save();vList()}
 else if(d.vs){const [i,t]=d.vs.split(":"),o=vp(i);o.s=o.s===t?"":t;if(o.s){const w=D.voc.find(x=>x.id===i);act((o.s==="l"?"Palabra aprendida: ":"Palabra a repasar: ")+(w?w.w:""),"vocabulario")}save();vList()}
 else if(d.vl){VS.f=d.vl;vView()}
 else if(d.vbt){VB.tab=d.vbt;vbView()}
 else if(d.vbf){VB.f=d.vbf;VB.ci=0;VB.show=false;vbView()}
 else if(d.vbc){vbCard(d.vbc)}
 else if("fxs" in d){fxStart()}
 else if("fxc" in d){fxCheck()}
 else if("fxn" in d){fxNext()}
 else if(d.mw){vbMW(+d.mw)}
 else if(d.mt){vbMT(+d.mt)}
 else if("mn" in d){mNew();vbView()}
 else if(d.pst){PS.tab=d.pst;TTS.stop();psView()}
 else if(d.pp){const r=PS.reg[+d.pp];TTS.speak(r[0],r[1])}
 else if(d.pps){const r=PS.reg[+d.pps];TTS.speak(r[0],r[1])}
 else if("ppx" in d){TTS.stop()}
 else if("ppr" in d){if(TTS.last)TTS.speak(TTS.last.text,TTS.last.o)}
 else if(d.psr){TTS.rate=+d.psr;S.tts={rate:TTS.rate,voice:TTS.voice};save();psView()}
 else if(d.psh){PS.show[d.psh]=!PS.show[d.psh];psView()}
 else if("alla" in d){TTS.queue(AL.map(a=>[a[2],1]))}
 else if(d.pdm){pdStart(d.pdm)}
 else if("pdc" in d){pdCheck()}
 else if("pdn" in d){pdNext()}
 else if("pdr" in d){PS.dc.tries[PS.dc.i]++;PS.dc.ck=null;PS.dc.text="";psView()}
 else if("pdx" in d){PS.dc=null;psView()}
 else if(d.dlo){PS.dl=+d.dlo;TTS.stop();psView()}
 else if("dla" in d){TTS.queue(DLG[PS.dl].l.map(l=>[l[1],l[0]==="A"?0.9:1.2]))}
 else if(d.dlq){const [i,j]=d.dlq.split(",").map(Number);PS.dq[PS.dl].sel[i]=j;psView()}
 else if(d.dlk){dlCheck(+d.dlk)}
 else if("dlr" in d){PS.dq[PS.dl]=null;psView()}
 else if(d.audio){const v=D.voc.find(x=>x.id===d.audio);if(v)TTS.speak(v.w)}
 else if(d.xi){X.stage="intro";X.code=d.xi;X.cfg=xCfg(d.xi);xView();window.scrollTo(0,0)}
 else if("xgo" in d){xStart()}
 else if("xp0" in d){TTS.speak("Hello. This is an audio test.")}
 else if(d.xo){X.ans[X.i]=+d.xo;X.skip[X.i]=false;X.warn="";X.warned=false;xView()}
 else if("xprev" in d){X.i--;X.warn="";xView()}
 else if("xnext" in d){X.i++;X.warn="";xView();window.scrollTo(0,0)}
 else if("xend" in d){xEnd()}
 else if("xp" in d){xPlay(false)}
 else if("xps" in d){xPlay(true)}
 else if("xk" in d){X.skip[X.i]=true;X.ans[X.i]=undefined;xView()}
 else if(d.xr){xAct(d.xr)}
 else if(d.xf){X.filter=d.xf;xView()}
 else if(d.xh){X.hist=+d.xh;X.stage="hist";xView();window.scrollTo(0,0)}
 else if("xhub" in d){TTS.stop();X.stage="hub";xView();window.scrollTo(0,0)}
 else if("xdel" in d){if(confirm("¿Borrar el historial de evaluaciones?")){S.ev=[];save();xView()}}
 else if("xrep" in d){xStart()}
 else if(d.prs){prStart(d.prs)}
 else if(d.pfd){PF.d=+d.pfd;prView()}
 else if("prc" in d){prCheck()}
 else if("prn" in d){prNext()}
 else if("prr" in d){prRetry()}
 else if(d.prx){prExit(d.prx)}
 else if(d.pro){PR.cur.sel=+d.pro;prView()}
 else if(d.pwb){PR.cur.ch.push(+d.pwb);prView()}
 else if(d.pwc){PR.cur.ch.splice(+d.pwc,1);prView()}
 else if("prclr" in d){PR.cur.ch=[];prView()}
 else if(d.open){sub={l:d.open};if(location.hash!=="#unidades")go("unidades");else route()}
 else if("done" in d){S.done[d.done]=S.done[d.done]?false:Date.now();if(S.done[d.done])act("Lección completada: "+lessons().find(x=>x.id===d.done).t,"unidades",d.done);save();R.unidades()}
 else if(d.cat){sub={c:+d.cat};R.vocabulario()}
 else if(d.quiz)startQuiz(d.quiz)
 else if(d.opt!==undefined&&Q&&!Q.ans){Q.ans=true;const q=Q.qs[Q.i],i=+d.opt;if(i===q.a)Q.s++;
  document.querySelectorAll(".opt").forEach((o,j)=>o.classList.add(j===q.a?"ok":j===i?"bad":"x"));$("#nx").hidden=false}
 else if("next" in d){Q.i++;Q.ans=false;drawQ()}
 else if("reset" in d){PG.ask=true;PG.msg="";pgView()}
 else if("resetno" in d){PG.ask=false;pgView()}
 else if("resetgo" in d){pgReset()}
 else if("pgx" in d){pgExport()}
 else if("pgi" in d){pgImport()}
 else if("pgig" in d){pgImportGo()}
 else if("pgin" in d){PG.ask2=false;PG.imp=null;pgView()}
 else if(d.ttab){TV.tab=d.ttab;TV.ask="";TV.msg="";TV.err="";tView()}
 else if("tadd" in d){tAddStudent()}
 else if(d.tren){TV.edit=d.tren;TV.ren=(TD.students.find(x=>x.id===d.tren)||{}).name||"";tView()}
 else if(d.trn){tRename(d.trn)}
 else if(d.tcur){tSnap(d.tcur,S)}
 else if(d.tpaste){TV.sel=d.tpaste;TV.paste="";TV.err="";tView()}
 else if(d.tpg){tPaste(d.tpg)}
 else if(d.tdel){TV.ask="del:"+d.tdel;tView()}
 else if("tno" in d){TV.ask="";TV.sel=null;TV.edit=null;TV.err="";tView()}
 else if(d.tyes){tConfirm(d.tyes)}
 else if("ttadd" in d){tAddTask()}
 else if(d.ttdel){TV.ask="task:"+d.ttdel;tView()}
 else if(d.tchk){tTo()[d.tchk]=!tTo()[d.tchk];tView()}
 else if(d.tman){tManual(d.tman)}
 else if("tgadd" in d){tAddGrade()}
 else if(d.tgdel){TV.ask="grade:"+d.tgdel;tView()}
 else if("tdemo" in d){tDemo()}
 else if("tundemo" in d){TV.ask="undemo";tView()}
 else if("texp" in d){TV.tx=JSON.stringify(TD);TV.err="";TV.msg="Copia lista: selecciona el texto y cópialo.";tView()}
 else if("timp" in d){tImport()}
 else if("treset" in d){TV.ask="reset";tView()}
 else if(d.pgr){if(d.pgr==="v"){VS.f="r";VS.c="";VS.q="";go("vocabulario")}else{VB.f="r";VB.tab="tarjetas";VB.ci=0;go("verbos")}}
});
document.addEventListener("input",e=>{if(e.target.id==="gs"){GS.q=e.target.value;gList()}else if(e.target.id==="gc"){GS.cat=e.target.value;gList()}});
addEventListener("hashchange",()=>{sub=location.hash==="#unidades"?sub:{};route()});
route();
